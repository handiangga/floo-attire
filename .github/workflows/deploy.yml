name: Deploy Floo Attire Static

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: floo-attire-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static Next.js
        run: npm run build

      - name: Verify static output
        run: |
          test -s out/index.html
          test -d out/_next
          echo "Static export ready"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload to staging on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          STAGING="/home/flooapp/attire-deploy-staging-${GITHUB_SHA}"
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "mkdir -p '$STAGING'"
          rsync -az --delete -e 'ssh -o StrictHostKeyChecking=yes' out/ "$VPS_USER@$VPS_HOST:$STAGING/"

      - name: Activate deployment and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "DEPLOY_SHA=$GITHUB_SHA bash -se" <<'REMOTE'
          set -Eeuo pipefail

          LIVE="/home/flooapp/attire-static"
          STAGING="/home/flooapp/attire-deploy-staging-$DEPLOY_SHA"
          BACKUP="/home/flooapp/attire-static-backup-$DEPLOY_SHA"

          test -s "$STAGING/index.html"
          test -d "$STAGING/_next"
          test ! -e "$BACKUP"

          if [ -d "$LIVE" ]; then
            mv "$LIVE" "$BACKUP"
          fi

          if ! mv "$STAGING" "$LIVE"; then
            if [ -d "$BACKUP" ]; then mv "$BACKUP" "$LIVE"; fi
            exit 1
          fi

          if ! curl -fsS --max-time 15 https://attire.floofashionn.com/ -o /dev/null; then
            echo "Health check failed, restoring previous version."
            mv "$LIVE" "$STAGING"
            if [ -d "$BACKUP" ]; then mv "$BACKUP" "$LIVE"; fi
            exit 1
          fi

          echo "Deployment OK: $DEPLOY_SHA"
          echo "Previous version: $BACKUP"
          REMOTE
